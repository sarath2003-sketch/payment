services:
  # PostgreSQL Database
  db:
    image: postgres:13-alpine
    container_name: amount_mgmt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amount_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amount_mgmt_network

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amount_mgmt_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-SecurePassword123}@db:5432/${POSTGRES_DB:-amount_management_db}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - amount_mgmt_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  amount_mgmt_network:
    driver: bridge
