services:
  - type: web
    name: payment-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_SQLITE
        value: "true"
      - key: USE_LOCAL_STORAGE
        value: "true"
      - key: DB_CLIENT
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: NODE_VERSION
        value: 20.18.0
